apiVersion: apps/v1
kind: Deployment
metadata:
  name: rl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rl
  template:
    metadata:
      labels:
        app: rl
    spec:
      containers:
        - name: rl
          image: rl:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: SERVER_ADDR
              value: ":8080"
            - name: REDIS_ADDR
              value: "redis:6379"
