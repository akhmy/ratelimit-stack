services:
  server:
    build: ./ratelimit
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      REDIS_ADDR: "redis:6379"
      RATE_LIMIT_WINDOW: 60s

  redis:
    image: redis:8.10-alpine
    volumes:
      - redis-data:/data

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight:/data

volumes:
  redisinsight:
  redis-data: